<style>

</style></head><body><div class="w">
<div class="hd"><div class="top"><div><h1>Controle de Obra</h1><div class="sub" id="sb"></div></div><button class="p" onclick="novo()">+ Novo gasto</button></div>

<script>

let S,armed=null,edit=null,det=null,tt,tab='p',flt={q:'',i:'',c:'',p:'',d:'',a:''};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),P=n=>n.toFixed(2).replace('.',',')+'%',num=v=>{v=String(v).trim();return parseFloat(v.includes(',')?v.replace(/\./g,'').replace(',','.'):v)};
const nk=s=>s.trim().replace(/\s+/g,' ').toLowerCase(),cap=s=>{s=s.trim().replace(/\s+/g,' ');return s.charAt(0).toUpperCase()+s.slice(1)};

function seed(){const itens={},gastos=[];SEED.g.forEach(([l,d,q,v],i)=>{const k=nk(d);if(!itens[k])itens[k]={nome:cap(d),cat:0,comp:'',un:'',ativo:true};gastos.push({id:i+1,k,q,v,dt:'',obs:'',orig:d,ln:l})});
return{obra:{nome:'',orc:SEED.orc,meta:null,ini:'',fim:'',st:'',alem:false},cats:CATS.map((n,i)=>({id:i+1,nome:n,ativo:true})),itens,gastos,next:1000}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.gastos)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const cn=id=>(S.cats.find(c=>c.id===id)||{}).nome||'',IT=g=>S.itens[g.k],CT=g=>cn(IT(g).cat)||'Sem categoria';

function go(t){tab=t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));['p','g','i','c','o'].forEach(i=>$(i).hidden=i!==t);scrollTo(0,0)}
function by(f){const m={};S.gastos.forEach(g=>{const k=f(g);m[k]=(m[k]||0)+T(g)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bars(a,t){const mx=a.length?a[0][1]:1;return a.map(([l,v])=>`<div class="r"><span title="${esc(l)}" style="overflow:hidden;text-overflow:ellipsis">${esc(l)}</span><div class="bar"><i style="width:${mx?v/mx*100:0}%"></i></div><b>${R(v)} <span class="sub">${t?P(v/t*100):''}</span></b></div>`).join('')}
const chip=p=>p>100?'<span class="tag bad">Ultrapassou</span>':p>=90?'<span class="tag warn">Próximo do limite</span>':'<span class="tag ok">Dentro do limite</span>';
const pb=p=>`<div class="bar" style="margin-top:8px"><i style="width:${Math.min(p,100)}%;background:${p>100?'var(--bad)':p>=90?'var(--warn)':'var(--acc)'}"></i></div>`;
const kpi=(k,v,s,c)=>`<div class="c"><div class="k">${k}</div><div class="v ${c||''}">${v}</div><div class="sub">${s||''}</div></div>`;
function panel(){const o=S.obra,c=calc(o.orc,o.meta,S.gastos.map(T)),sum=f=>S.gastos.filter(f).reduce((a,g)=>a+T(g),0),rec=sum(g=>IT(g).comp==='recorrente'),pon=sum(g=>IT(g).comp==='pontual'),nc=Math.max(0,Math.round((c.t-rec-pon)*100)/100),sem=S.gastos.filter(g=>!IT(g).cat||!IT(g).comp).length,w=x=>c.t?x/c.t*100:0,
top=by(g=>g.k).slice(0,10).map(([k,v])=>[S.itens[k].nome,v]),cats=by(CT),hasC=cats.some(x=>x[0]!=='Sem categoria'),sh=top.reduce((a,x)=>a+x[1],0);
$('p').innerHTML=`<div class="sub" style="margin-bottom:10px"><b>${esc(o.nome)||'Obra sem nome'}</b>${o.st?' · '+esc(o.st):''}${o.ini?' · início '+o.ini.split('-').reverse().join('/'):''}${o.fim?' · previsão '+o.fim.split('-').reverse().join('/'):''} · <a href="#" onclick="go('o');return false" style="color:var(--acc)">editar obra</a></div>
<div class="g">${kpi('Orçamento',R(o.orc))}${kpi('Meta de gasto',o.meta==null?'—':R(o.meta),o.meta==null?'Defina na aba Obra':'')}${kpi('Total gasto',R(c.t),S.gastos.length+' lançamentos')}${kpi('Saldo disponível',R(c.sd),'Orçamento − gasto',c.sd<0?'bad':'ok')}
${kpi('Restante da meta',c.rm==null?'—':R(c.rm),c.rm==null?'':c.rm<0?'Meta ultrapassada':'Até atingir a meta',c.rm!=null&&c.rm<0?'bad':'')}
<div class="c"><div class="k">Consumo do orçamento</div><div class="v">${P(c.po)}</div>${pb(c.po)}<div class="sub" style="margin-top:6px">${chip(c.po)}</div></div>
<div class="c"><div class="k">Consumo da meta</div><div class="v">${c.pm==null?'—':P(c.pm)}</div>${c.pm==null?'':pb(c.pm)+'<div class="sub" style="margin-top:6px">'+chip(c.pm)+'</div>'}</div>
${kpi('Recorrente',R(rec),P(w(rec))+' do gasto')}${kpi('Pontual',R(pon),P(w(pon))+' do gasto')}${kpi('Sem classificação',sem,sem?'<a href="#" onclick="go(\'i\');return false" style="color:var(--acc)">gastos sem categoria ou comportamento</a>':'Tudo classificado',sem?'warn':'ok')}</div>
<div class="c" style="margin-top:12px"><h2>Recorrente × pontual</h2><div class="bar"><i style="width:${w(rec)}%"></i><i style="width:${w(pon)}%;background:var(--ok)"></i><i style="width:${w(nc)}%;background:var(--mut);opacity:.4"></i></div><div class="sub" style="margin-top:6px"><span style="color:var(--acc)">■</span> Recorrente ${R(rec)} &nbsp; <span class="ok">■</span> Pontual ${R(pon)} &nbsp; ■ Sem classificar ${R(nc)}</div></div>
<div class="c"><h2>Por categoria</h2>${hasC?bars(cats,c.t):'<div class="sub">Nenhuma categoria atribuída aos itens ainda (aba Itens). Nenhum valor é estimado.</div>'}</div>
<div class="c"><h2>Maiores itens (consolidados)</h2>${bars(top,c.t)}<div class="sub">Os 10 maiores itens somam ${R(sh)} (${P(c.t?sh/c.t*100:0)} do total).</div></div>`;
$('sb').textContent=(o.nome||'Obra sem nome')+' · '+(c.po>100?'orçamento ultrapassado':c.po>=90?'próximo do limite':'dentro do limite')}
const opts=(a,sel,all)=>(all?`<option value="">${all}</option>`:'')+a.map(([v,l])=>`<option value="${esc(v)}" ${String(sel)===String(v)?'selected':''}>${esc(l)}</option>`).join('');
const its=()=>Object.entries(S.itens).sort((a,b)=>a[1].nome.localeCompare(b[1].nome,'pt-BR')),acats=()=>S.cats.filter(c=>c.ativo).map(c=>[c.id,c.nome]);
function gastos(){const e=S.gastos.find(g=>g.id===edit);
$('g').innerHTML=`<div class="c"><h2>${e?'Editar gasto':'Novo gasto'}</h2><div class="f">
<div><label>Item *</label><input id="fi" list="dl" value="${e?esc(IT(e).nome):''}" autocomplete="off"><datalist id="dl">${its().filter(x=>x[1].ativo).map(([k,x])=>`<option value="${esc(x.nome)}">`).join('')}</datalist></div>
<div><label>Quantidade *</label><input id="fq" inputmode="decimal" value="${e?e.q:''}" oninput="pv()"></div><div><label>Valor unitário *</label><input id="fv" inputmode="decimal" value="${e?e.v:''}" oninput="pv()"></div>
<div><label>Total (automático)</label><input id="ft" readonly value="${e?R(T(e)):''}"></div><div><label>Data ${e&&e.ln?'':'*'}</label><input id="fd" type="date" value="${e?e.dt:''}"></div>
<div><label>Observação</label><input id="fo" value="${e?esc(e.obs):''}"></div><div><button class="p" onclick="add()">${e?'Salvar':'Adicionar'}</button> ${e?'<button onclick="edit=null;draw()">Cancelar</button>':''}</div></div><div class="sub bad" id="er"></div></div>
<div class="c"><div class="f" style="margin-bottom:10px"><input placeholder="Buscar item ou observação" value="${esc(flt.q)}" oninput="flt.q=this.value;gl()"><select onchange="flt.i=this.value;gl()">${opts(its().map(([k,x])=>[k,x.nome]),flt.i,'Todos os itens')}</select>
<select onchange="flt.c=this.value;gl()">${opts(S.cats.map(c=>[c.nome,c.nome]).concat([['Sem categoria','Sem categoria']]),flt.c,'Todas as categorias')}</select><select onchange="flt.p=this.value;gl()">${opts([['recorrente','Recorrente'],['pontual','Pontual'],['-','Sem comportamento']],flt.p,'Recorrente e pontual')}</select>
<div><label>De</label><input type="date" value="${flt.d}" onchange="flt.d=this.value;gl()"></div><div><label>Até</label><input type="date" value="${flt.a}" onchange="flt.a=this.value;gl()"></div></div><div class="sc" id="gl"></div></div>`;gl()}
function gl(){const q=flt.q.toLowerCase(),rows=S.gastos.filter(g=>{const x=IT(g);return(!flt.i||g.k===flt.i)&&(!q||(x.nome+' '+g.obs).toLowerCase().includes(q))&&(!flt.c||CT(g)===flt.c)&&(!flt.p||(x.comp||'-')===flt.p)&&(!flt.d||(g.dt&&g.dt>=flt.d))&&(!flt.a||(g.dt&&g.dt<=flt.a))}).slice().sort((a,b)=>(b.dt||'').localeCompare(a.dt||'')||b.id-a.id),s=rows.reduce((a,g)=>a+T(g),0);
$('gl').innerHTML=`<table><tr><th>Data</th><th>Item</th><th>Categoria</th><th>Comport.</th><th class="n">Qtd</th><th class="n">Unitário</th><th class="n">Total</th><th></th></tr>${rows.map(g=>{const x=IT(g);return`<tr><td>${g.dt?g.dt.split('-').reverse().join('/'):'<span class="sub">n/i</span>'}</td><td>${esc(x.nome)}</td><td>${esc(cn(x.cat))||'<span class="sub">—</span>'}</td><td>${x.comp?`<span class="tag">${x.comp}</span>`:'<span class="sub">—</span>'}</td><td class="n">${g.q}${x.un?' '+esc(x.un):''}</td><td class="n">${R(g.v)}</td><td class="n"><b>${R(T(g))}</b></td><td><button class="ib" onclick="det=det===${g.id}?null:${g.id};gl()">ver</button><button class="ib" onclick="edit=${g.id};go('g');draw();scrollTo(0,0)">editar</button><button class="ib" onclick="del(${g.id})">${armed===g.id?'confirmar?':'excluir'}</button></td></tr>${det===g.id?`<tr><td colspan="8" class="sub" style="white-space:normal">Observação: ${esc(g.obs)||'—'} · ${g.ln?'Origem: planilha, linha '+g.ln+' (“'+esc(g.orig.trim())+'”)':'Lançamento manual'} · Cálculo: ${g.q} × ${R(g.v)} = ${R(T(g))}</td></tr>`:''}`}).join('')}<tr><td colspan="6"><b>${rows.length} lançamentos</b></td><td class="n"><b>${R(s)}</b></td><td></td></tr></table>`}
function pv(){const q=num(fq.value),v=num(fv.value);ft.value=q>=0&&v>=0?R(Math.round(q*v*100)/100):''}
function novo(){edit=null;go('g');draw();$('fi').focus()}
function add(){const n=cap(fi.value),q=num(fq.value),v=num(fv.value),e=S.gastos.find(g=>g.id===edit),d=fd.value;let m='';
if(!n)m='Informe o item.';else if(!(q>0))m='Quantidade deve ser maior que zero.';else if(!(v>=0))m='Informe o valor unitário.';else if(!d&&!(e&&e.ln))m='Informe a data do gasto.';if(m){$('er').textContent=m;return}

function setI(el,f){const x=S.itens[el.dataset.k];x[f]=f==='cat'?+el.value:f==='ativo'?el.checked:el.value.trim();save();draw()}
function addI(){const n=cap(ni.value),k=nk(n);if(!n||S.itens[k]){$('ei').textContent=n?'Esse item já existe.':'Informe o nome do item.';return}S.itens[k]={nome:n,cat:+nc.value||0,comp:nm.value,un:nu.value.trim(),ativo:true};save();draw();toast('Item cadastrado.')}
function itens(){const m={};S.gastos.forEach(g=>{const a=m[g.k]||(m[g.k]={n:0,q:0,t:0});a.n++;a.q+=g.q;a.t+=T(g)});
const cs=x=>`<select data-k="${esc(x)}" onchange="setI(this,'cat')">${opts(S.cats.filter(c=>c.ativo||c.id===S.itens[x].cat).map(c=>[c.id,c.nome]),S.itens[x].cat,'—')}</select>`,cm=x=>`<select data-k="${esc(x)}" onchange="setI(this,'comp')">${opts([['recorrente','Recorrente'],['pontual','Pontual']],S.itens[x].comp,'—')}</select>`;
$('i').innerHTML=`<div class="c"><h2>Novo item</h2><div class="f"><div><label>Nome *</label><input id="ni"></div><div><label>Categoria</label><select id="nc">${opts(acats(),'','—')}</select></div><div><label>Comportamento</label><select id="nm">${opts([['recorrente','Recorrente'],['pontual','Pontual']],'','—')}</select></div><div><label>Unidade</label><input id="nu" placeholder="ex.: saco, m³"></div><div><button class="p" onclick="addI()">Cadastrar</button></div></div><div class="sub bad" id="ei"></div></div>
<div class="c"><h2>Itens e consolidado</h2><div class="sub" style="margin-bottom:8px">Nomes idênticos são um único item com vários lançamentos. Variações (ex.: “cimento mizu”) ficam separadas até validação.</div><div class="sc"><table><tr><th>Item</th><th class="n">Lanç.</th><th class="n">Qtd</th><th class="n">Total</th><th>Categoria</th><th>Comportamento</th><th>Unidade</th><th>Ativo</th></tr>${its().map(([k,x])=>{const a=m[k]||{n:0,q:0,t:0};return`<tr><td>${esc(x.nome)}</td><td class="n">${a.n}</td><td class="n">${+a.q.toFixed(2)}</td><td class="n"><b>${R(a.t)}</b></td><td>${cs(k)}</td><td>${cm(k)}</td><td><input value="${esc(x.un)}" style="width:80px" data-k="${esc(k)}" onchange="setI(this,'un')"></td><td><input type="checkbox" ${x.ativo?'checked':''} data-k="${esc(k)}" onchange="setI(this,'ativo')"></td></tr>`}).join('')}</table></div></div>`}
function cats(){const t={},n={};S.gastos.forEach(g=>{t[IT(g).cat]=(t[IT(g).cat]||0)+T(g)});Object.values(S.itens).forEach(x=>n[x.cat]=(n[x.cat]||0)+1);
$('c').innerHTML=`<div class="c"><h2>Categorias</h2><div class="f" style="margin-bottom:10px"><input id="cnm" placeholder="Nova categoria"><div><button class="p" onclick="addC()">Adicionar</button></div></div><div class="sub bad" id="ec"></div><div class="sc"><table><tr><th>Nome</th><th class="n">Itens</th><th class="n">Total</th><th>Status</th></tr>${S.cats.map(c=>`<tr><td><input value="${esc(c.nome)}" onchange="renC(${c.id},this.value)"></td><td class="n">${n[c.id]||0}</td><td class="n">${R(t[c.id]||0)}</td><td><button class="ib" onclick="togC(${c.id})">${c.ativo?'Desativar':'Reativar'}</button> <span class="tag ${c.ativo?'ok':''}">${c.ativo?'ativa':'inativa'}</span></td></tr>`).join('')}</table></div><div class="sub" style="margin-top:8px">Categorias com lançamentos nunca são apagadas; apenas desativadas.</div></div>`}
function addC(){const n=cap(cnm.value);if(!n||S.cats.some(c=>c.nome.toLowerCase()===n.toLowerCase())){$('ec').textContent=n?'Categoria já existe.':'Informe o nome.';return}S.cats.push({id:Math.max(0,...S.cats.map(c=>c.id))+1,nome:n,ativo:true});save();draw()}
function renC(id,v){v=cap(v);if(v){S.cats.find(c=>c.id===id).nome=v;save()}draw()}
function togC(id){const c=S.cats.find(c=>c.id===id);c.ativo=!c.ativo;save();draw()}
function tests(){const a=calc(25000,23500,[500,750,1250]),b=calc(25000,23500,[]),s=calc(25000,null,SEED.g.map(x=>Math.round(x[2]*x[3]*100)/100)),e=calc(1000,1000,[1000]),x=calc(1000,900,[1100]),tk=k=>Math.round(SEED.g.filter(r=>nk(r[1])===k).reduce((t,r)=>t+r[2]*r[3],0)*100)/100;
return[['Exemplo do plano: total 2.500, saldo 22.500, resta da meta 21.000',a.t==2500&&a.sd==22500&&a.rm==21000],['Sem gastos: saldo igual ao orçamento',b.t==0&&b.sd==25000],['Planilha: 48 lançamentos, R$ 22.984,08, saldo R$ 2.015,92, 91,94%',SEED.g.length==48&&s.t==22984.08&&Math.round(s.sd*100)==201592&&P(s.po)=='91,94%'],['Consolidação: brita 288, cimento 1.404,70, telha 2.658',tk('brita')==288&&tk('cimento')==1404.7&&tk('telha')==2658],['Gasto igual ao orçamento: saldo 0 e 100%',e.sd==0&&e.po==100],['Gasto acima da meta e do orçamento: valores negativos',x.rm==-200&&x.sd==-100]]}
function obra(){const o=S.obra;$('o').innerHTML=`<div class="c"><h2>Dados da obra</h2><div class="f"><div><label>Nome *</label><input id="obn" value="${esc(o.nome)}"></div><div><label>Orçamento *</label><input id="obo" inputmode="decimal" value="${o.orc}"></div><div><label>Meta de gasto</label><input id="obm" inputmode="decimal" value="${o.meta??''}" placeholder="opcional"></div>
<div><label>Início</label><input id="obi" type="date" value="${o.ini}"></div><div><label>Previsão de conclusão</label><input id="obf" type="date" value="${o.fim}"></div><div><label>Status</label><select id="obs">${opts([['Planejada','Planejada'],['Em andamento','Em andamento'],['Pausada','Pausada'],['Concluída','Concluída']],o.st,'Não informado')}</select></div></div>
<label class="sub" style="display:block;margin:10px 0"><input type="checkbox" id="oba" ${o.alem?'checked':''}> Permitir meta acima do orçamento</label><button class="p" onclick="saveO()">Salvar obra</button><div class="sub bad" id="eo"></div></div>
<div class="c"><h2>Testes dos cálculos financeiros</h2>${tests().map(([n,ok])=>`<div class="sub"><span class="${ok?'ok':'bad'}">${ok?'✓':'✗'}</span> ${n}</div>`).join('')}</div>
<div class="c"><h2>Dados</h2><div class="sub" style="margin-bottom:8px">Restaura os 48 lançamentos originais da planilha e remove alterações feitas aqui.</div><button id="rb" onclick="rst()">Restaurar dados da planilha</button></div>`}
function saveO(){const n=obn.value.trim(),orc=num(obo.value),m=obm.value.trim()===''?null:num(obm.value),a=oba.checked;let e='';
if(!n)e='Nome da obra é obrigatório.';else if(!(orc>0))e='Orçamento deve ser maior que zero.';else if(m!==null&&!(m>0))e='Meta deve ser maior que zero.';else if(m>orc&&!a)e='A meta excede o orçamento. Marque a opção para permitir.';else if(obi.value&&obf.value&&obf.value<obi.value)e='A previsão de conclusão é anterior ao início.';
if(e){$('eo').textContent=e;return}Object.assign(S.obra,{nome:n,orc,meta:m,alem:a,ini:obi.value,fim:obf.value,st:obs.value});save();draw();toast('Obra salva.')}
function rst(){const b=$('rb');if(b.dataset.a!=='1'){b.dataset.a='1';b.textContent='Confirmar? Apaga alterações';return}S=seed();save();edit=null;draw();toast('Dados restaurados.')}
function draw(){panel();gastos();itens();cats();obra();
$('note').textContent=`Fonte: planilha.xlsx — ${SEED.g.length} lançamentos importados (linhas ${SEED.g[0][0]}–${SEED.g[SEED.g.length-1][0]}); linhas ${SEED.o.join(' e ')} ignoradas (sem item nem valor). Datas, categorias e comportamento não existem na planilha e ficam em branco. Alerta “próximo do limite” a partir de 90%. Dados salvos neste navegador.`}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));draw();
</script></body></html>
